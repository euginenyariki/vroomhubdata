name: Static site checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate site structure
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify documentation and entrypoint
        run: |
          test -s README.md
          test -s index.html
          grep -qi '<html' index.html
          echo "Static site structure looks valid."
